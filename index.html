<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Immersive analytics workspace that transforms prompts into living insights, narratives, and decisions."
    />
    <title>Immersive Analytics Workspace</title>
    <link rel="icon" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms"></script>
    <script src="assets/tailwind-config.js"></script>
    <script src="assets/theme-init.js"></script>
    <link rel="stylesheet" href="assets/styles.css" />

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="assets/app.js"></script>

  </head>
  <body class="min-h-screen font-sans transition-colors duration-200">
    <header class="header-bar sticky top-0 z-30">
      <nav class="mx-auto flex w-full max-w-[110rem] items-center gap-3 px-5 py-2 md:px-8">
        <a class="brand-pill" href="#home">
          <img
            src="assets/logo.svg"
            alt="Company emblem"
            class="h-9 w-9"
          />
          <span class="sr-only">Home</span>
        </a>
        <button
          type="button"
          class="nav-toggle ml-auto lg:hidden"
          aria-label="Toggle navigation"
          aria-expanded="false"
          data-nav-toggle
        >
          <span class="sr-only">Toggle navigation</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
        <div
          class="hidden items-center gap-2 text-sm font-medium lg:ml-auto lg:flex"
          data-nav-links
        >
          <a class="nav-link" href="#home" data-route-link="home">
            Overview
          </a>
          <a class="nav-link" href="#capabilities" data-route-link="capabilities">
            Capabilities
          </a>
          <a class="nav-link" href="#workflow" data-route-link="workflow">
            Workflow
          </a>
          <a class="nav-link" href="#insights" data-route-link="insights">
            Insights
          </a>
          <a class="nav-link" href="#faq" data-route-link="faq">
            FAQ
          </a>
        </div>
      </nav>
      <div class="drawer-panel hidden px-6 py-4 lg:hidden" data-nav-drawer>
        <div class="flex flex-col gap-2 text-base font-medium">
          <a class="nav-link justify-center" href="#home" data-route-link="home">
            Overview
          </a>
          <a class="nav-link justify-center" href="#capabilities" data-route-link="capabilities">
            Capabilities
          </a>
          <a class="nav-link justify-center" href="#workflow" data-route-link="workflow">
            Workflow
          </a>
          <a class="nav-link justify-center" href="#insights" data-route-link="insights">
            Insights
          </a>
          <a class="nav-link justify-center" href="#faq" data-route-link="faq">
            FAQ
          </a>
        </div>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-[110rem] flex-col gap-14 px-4 pb-24 pt-16 sm:gap-16 sm:px-6 lg:px-8 lg:pb-28 lg:pt-28">
      <section class="animate-fade-up flex min-h-[60vh] items-stretch justify-center">
        <div class="surface hub-panel rounded-[32px] lg:rounded-[36px]">
          <div class="panel-bar">
            <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.26em]">
              <span class="grid h-9 w-9 place-items-center">
                <img src="assets/badge.svg" alt="Companion badge" class="h-9 w-9" />
              </span>
              Companion stream
            </div>
            <span class="muted text-xs">Simulated journey preview</span>
          </div>
          <div class="workspace-gradient flex-1 p-8 text-base transition-colors sm:p-10" id="route-outlet">
            <div class="grid h-full place-items-center text-center text-sm muted">
              Loading content…
            </div>
          </div>
        </div>
      </section>

    </main>
    <footer class="footer-bar py-4">
      <div class="mx-auto flex w-full max-w-[110rem] flex-col gap-2 px-5 text-sm md:flex-row md:items-center md:justify-between md:px-8">
        <p class="muted tracking-wide">
          &copy; <span id="copyright-year"></span> All rights reserved
        </p>
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex gap-2">
            <a class="nav-link" href="#capabilities" data-route-link="capabilities">Product</a>
            <a class="nav-link" href="#workflow" data-route-link="workflow">Flow</a>
            <a class="nav-link" href="#insights" data-route-link="insights">Insights</a>
          </div>
          <button
            type="button"
            aria-pressed="false"
            class="theme-toggle"
            aria-label="Toggle theme"
            data-theme-toggle
          >
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v2" />
              <path d="M5.63 6.36l1.41 1.41" />
              <path d="M3 12h2" />
              <path d="M5.63 17.64l1.41-1.41" />
              <path d="M12 19v2" />
              <path d="M17.36 16.23l1.41 1.41" />
              <path d="M19 12h2" />
              <path d="M17.36 7.77l1.41-1.41" />
              <circle cx="12" cy="12" r="4" />
            </svg>
            <span>Dark mode</span>
          </button>
        </div>
      </div>
    </footer>
  </body>
</html>
